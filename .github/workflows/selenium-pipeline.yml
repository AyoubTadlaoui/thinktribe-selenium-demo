name: Selenium CI Pipeline

on: [push, pull_request]

jobs:
  selenium:
    runs-on: macos-latest  

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.8

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Enable Safari Remote Automation
        run: |
          echo "Please ensure that 'Allow Remote Automation' is enabled in Safari's Developer menu."
          echo "To enable, run: 'safaridriver --enable' in your local terminal."

      - name: Run Selenium Test
        run: python selenium_test.py

