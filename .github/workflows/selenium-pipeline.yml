name: Selenium CI Pipeline

on: [push, pull_request]

jobs:
  selenium:
    runs-on: macos-latest  # Use macOS for Safari testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.8

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Enable Safari Remote Automation
        run: |
          echo "To enable 'Allow Remote Automation' in Safari, please do it manually on your local machine."
          echo "You may need to run this command locally: 'safaridriver --enable'"

      - name: Run Selenium Test
        run: python selenium_test.py
